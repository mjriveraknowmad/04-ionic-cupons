<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center">
       Mis cupones
    </ion-title>
    <ion-item slot="end" color="transparent" lines="none" (click)="startCamera()">
      <ion-icon name="camera-outline"></ion-icon>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-segment>
    <ion-segment-button value="candies" content-id="first">
      <ion-label>Dulces</ion-label>
    </ion-segment-button>
    <ion-segment-button value="drinks" content-id="second">
      <ion-label>Bebidas</ion-label>
    </ion-segment-button>
    <ion-segment-button value="meats" content-id="third">
      <ion-label>Carnes</ion-label>
    </ion-segment-button>
  </ion-segment>
  <ion-segment-view>
    <ion-segment-content id="first">
      <ng-container [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{ category: 'candies' }"></ng-container>
    </ion-segment-content>
    <ion-segment-content id="second">
      <ng-container [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{ category: 'drinks' }"></ng-container>
    </ion-segment-content>
    <ion-segment-content id="third">
      <ng-container  [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{ category: 'meats' }"></ng-container>
    </ion-segment-content>
  </ion-segment-view>

  <ng-template #couponTemplate let-category="category">
    <ion-row>
      @for(coupon of (coupons() | filterCouponCategory:category); track coupon.idProduct){
      <ion-col size="6">
        <ion-card class="rounded" (click)="changeActiveCoupon(coupon)" [color]="coupon.active?'secondary':'light'" >
          <ion-img [src]="coupon.img"></ion-img>
          <ion-card-header class="ion-text-center ion-no-padding ion-padding-top ion-padding-bottom">
            <ion-card-subtitle>{{ coupon.name }}</ion-card-subtitle>
            <ion-card-title>{{ coupon.discount }}%</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
      }
    </ion-row>
  </ng-template>
</ion-content>
